trash_id: 9364dd386c9b4a1100dde8264690add7
name: HLG
includeCustomFormatWhenRenaming: false
description: 'HLG


  This Custom Format matches HLG releases. The default score can be used to prevent
  downloading HLG releases on devices that can''t play them properly, e.g., the picture
  appears very dark and murky, making it unwatchable.


  HLG or HLG10 is an HDR format developed by NHK (JP) and the BBC, suitable for both
  video and still images. This format is backwards compatible with SDR UHD TVs but
  not with older SDR displays that do not support Rec. 2020 color standards.


  You will mainly see this with cable, satellite, and over-the-air TV broadcasts from
  networks like the BBC and National Geographic.'
tags:
- Release Title
- Trash Guides
