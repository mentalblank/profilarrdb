description: "Canal+\n\nCanal+ is a French subscription streaming service and pay\
  \ TV provider, launched as a satellite service in 1992 and relaunched as a streaming\
  \ platform in 2013. It is a subsidiary of Canal+ S.A. It offers movies, dramas,\
  \ original series, and live sports \u2014 including top football leagues. The service\
  \ is available across Europe, Africa, Oceania, Myanmar, and Vietnam, with over 26.8\
  \ million subscribers.\n\nFor more information, visit the Canal+ Wikipedia page\
  \ (https://en.wikipedia.org/wiki/Canal%2B_(streaming_service))."
